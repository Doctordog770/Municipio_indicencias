<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión / Registrarse — Municipalidad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#FBECEC;
    --ink:#1A1A1A; --ink-soft:#7A4A4A; --border:#E8C9C9;
    --radius:6px;

    --verde:#8C1616; --verde-oscuro:#5E0F0F;
    --rojo:#C81E1E;  --rojo-oscuro:#8C1414;
    --amarillo:#B4231F; --amarillo-oscuro:#7C1512;

    --tema:#C81E1E; --tema-oscuro:#8C1414; --tema-texto:#FFFFFF;
  }

  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --bg:#1A1010; --surface:#241414; --surface-2:#2E1818;
      --ink:#F5E8E8; --ink-soft:#C99; --border:#4A2424;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1A1010; --surface:#241414; --surface-2:#2E1818;
    --ink:#F5E8E8; --ink-soft:#C99; --border:#4A2424;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height:1.5; min-height:100vh;
  }
  button{ font-family:inherit; cursor:pointer; }
  :focus-visible{ outline:3px solid var(--tema); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }

  /* ---------- Login / Registro ---------- */
  .auth-envoltorio{ display:flex; align-items:center; justify-content:center; min-height:100vh; padding:0; }
  .auth-contenedor{
    position:relative; width:100%; max-width:100%; height:100vh; min-height:100vh;
    background:var(--surface); border-radius:0; overflow:hidden;
    box-shadow:none;
  }

  .formulario-login, .formulario-registro{
    position:absolute; top:0; left:0; width:50%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:4px; padding:0 45px; overflow-y:auto; -webkit-overflow-scrolling:touch;
    transition:transform .6s ease-in-out, opacity .5s ease-in-out;
  }
  .formulario-login{ z-index:2; opacity:1; transform:translateX(0%); }
  .formulario-registro{ z-index:1; opacity:0; pointer-events:none; transform:translateX(0%); justify-content:flex-start; padding:48px 45px; }

  .auth-contenedor.derecha .formulario-login{ transform:translateX(100%); opacity:0; z-index:1; pointer-events:none; }
  .auth-contenedor.derecha .formulario-registro{ transform:translateX(100%); opacity:1; z-index:2; pointer-events:auto; }

  .auth-form h2{ font-family:"Barlow Condensed",sans-serif; font-size:30px; font-weight:700; margin:0 0 14px; letter-spacing:-.02em; }
  .auth-form .sub{ display:block; font-size:12px; margin-bottom:14px; color:var(--ink-soft); }
  .auth-campo{ width:300px; max-width:100%; margin-bottom:12px; }
  .auth-campo label{ display:block; font-size:11.5px; font-weight:600; margin-bottom:5px; color:var(--ink-soft); }
  .auth-campo-caja{
    display:flex; align-items:center; gap:10px; width:100%; height:46px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:0 16px;
  }
  .auth-campo-caja svg{ width:17px; height:17px; color:var(--ink-soft); flex-shrink:0; }
  .auth-campo input{
    border:none; outline:none; width:100%; height:100%; background:transparent;
    color:var(--ink); font-family:inherit; font-size:14px; padding:0;
  }
  .auth-campo input::placeholder{ color:var(--ink-soft); }
  .msg-auth{ color:var(--rojo-oscuro); font-size:12px; margin:5px 0 0; min-height:1em; font-weight:500; }
  .btn-auth{
    width:170px; height:46px; margin-top:8px; background:var(--tema); color:var(--tema-texto);
    border:none; border-radius:23px; font-size:15px; font-weight:600;
    transition:transform .15s ease, box-shadow .15s ease, background-color .25s ease;
  }
  .btn-auth:hover{ transform:translateY(-1px); box-shadow:0 10px 20px rgba(0,0,0,.2); }
  .btn-auth:disabled{ opacity:.7; cursor:default; transform:none; box-shadow:none; }
  .enlace-cambio{
    display:none; margin-top:16px; background:none; border:none; color:var(--tema);
    font-weight:600; font-size:13px; text-align:left; padding:0;
  }

  .auth-superposicion-env{
    position:absolute; top:0; left:50%; width:50%; height:100%;
    overflow:hidden; border-radius:0 24px 24px 0; z-index:10;
    transition:transform .6s ease-in-out, border-radius .6s ease-in-out; transform:translateX(0%);
  }
  .auth-contenedor.derecha .auth-superposicion-env{ transform:translateX(-100%); border-radius:24px 0 0 24px; }

  .auth-superposicion{
    position:absolute; top:0; left:0; width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; padding:0 44px; text-align:center; color:#fff;
    background:linear-gradient(160deg, var(--tema-oscuro), var(--tema));
    transition:opacity .5s ease-in-out;
  }

  .auth-panel{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center; }
  .auth-panel h3{ font-family:"Barlow Condensed",sans-serif; font-size:32px; font-weight:800; letter-spacing:-.02em; margin:0; }
  .auth-panel p{ font-size:14px; line-height:1.6; opacity:.9; margin:0; }
  .btn-auth-ghost{
    background:transparent; border:2px solid #fff; color:#fff;
    border-radius:23px; padding:10px 26px; font-size:13.5px; font-weight:700;
  }
  .btn-auth-ghost:hover{ background:rgba(255,255,255,.12); }

  .auth-panel-izq{ opacity:1; pointer-events:auto; position:absolute; inset:0; }
  .auth-contenedor.derecha .auth-panel-izq{ opacity:0; pointer-events:none; }
  .auth-panel-der{ opacity:0; pointer-events:none; position:absolute; inset:0; }
  .auth-contenedor.derecha .auth-panel-der{ opacity:1; pointer-events:auto; }

  @media (max-width:720px){
    .auth-contenedor{ width:100%; height:auto; min-height:100vh; border-radius:0; }
    .auth-superposicion-env{ display:none; }
    .formulario-login, .formulario-registro{
      position:relative; width:100%; height:auto; min-height:100vh;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:40px 28px;
      opacity:1 !important; pointer-events:auto !important; transform:none !important;
    }
    .formulario-registro{ display:none; }
    .auth-contenedor.derecha .formulario-login{ display:none; }
    .auth-contenedor.derecha .formulario-registro{ display:flex; }
    .enlace-cambio{ display:block; }
  }
</style>
</head>
<body>

<div class="auth-envoltorio">
  <div class="auth-contenedor" id="authContenedor">

    <!-- ===== LOGIN — mismos campos/endpoint que SignIn.html + Sing_in_Code.php ===== -->
    <form class="formulario-login auth-form" id="formLogin" novalidate>
      <h2>Iniciar sesión</h2>
      <span class="sub">Entrá con tu cuenta para reportar y ver incidencias.</span>

      <div class="auth-campo">
        <label for="loginGmail">Correo electrónico</label>
        <div class="auth-campo-caja">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18v12H3z"/><path d="m3 7 9 6 9-6"/></svg>
          <input id="loginGmail" name="gmail" type="email" placeholder="tu@correo.com" autocomplete="username" required>
        </div>
      </div>
      <div class="auth-campo">
        <label for="loginContrasena">Contraseña</label>
        <div class="auth-campo-caja">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/></svg>
          <input id="loginContrasena" name="contrasena" type="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
      </div>

      <button type="submit" class="btn-auth">Entrar</button>
      <button type="button" class="enlace-cambio" id="irRegisterMovil">¿No tenés cuenta? Registrate</button>
      <p id="errorLogin" class="msg-auth"></p>
    </form>

    <!-- ===== REGISTRO — mismos campos/endpoint que Signup.html + Sing_Up_Code.php ===== -->
    <form class="formulario-registro auth-form" id="formRegister" novalidate>
      <h2>Crear cuenta</h2>
      <span class="sub">Registrate para empezar a reportar en tu barrio.</span>

      <div class="auth-campo">
        <label for="regNombre">Nombre</label>
        <div class="auth-campo-caja">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          <input id="regNombre" name="Nombre" type="text" placeholder="Ej: Lucía" autocomplete="given-name" required>
        </div>
      </div>
      <div class="auth-campo">
        <label for="regApellido">Apellido</label>
        <div class="auth-campo-caja">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          <input id="regApellido" name="Apellido" type="text" placeholder="Ej: Medina" autocomplete="family-name" required>
        </div>
      </div>
      <div class="auth-campo">
        <label for="regDni">DNI</label>
        <div class="auth-campo-caja">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h6M7 13h10"/></svg>
          <input id="regDni" name="Dni" type="number" placeholder="Sin puntos, 7 u 8 dígitos" autocomplete="off" required>
        </div>
      </div>
      <div class="auth-campo">
        <label for="regGmail">Correo electrónico</label>
        <div class="auth-campo-caja">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18v12H3z"/><path d="m3 7 9 6 9-6"/></svg>
          <input id="regGmail" name="Gmail" type="email" placeholder="tu@correo.com" autocomplete="email" required>
        </div>
      </div>
      <div class="auth-campo">
        <label for="regLocalidad">Localidad</label>
        <div class="auth-campo-caja">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-7.5 7-12a7 7 0 1 0-14 0c0 4.5 7 12 7 12Z"/><circle cx="12" cy="9" r="2.5"/></svg>
          <input id="regLocalidad" name="localidad" type="text" placeholder="Ej: Castelar" autocomplete="address-level2" required>
        </div>
      </div>
      <div class="auth-campo">
        <label for="regDireccion">Dirección</label>
        <div class="auth-campo-caja">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10 12 3l9 7"/><path d="M5 9v11h14V9"/></svg>
          <input id="regDireccion" name="direccion" type="text" placeholder="Calle y altura" autocomplete="street-address" required>
        </div>
      </div>
      <div class="auth-campo">
        <label for="regCodigoPostal">Código postal</label>
        <div class="auth-campo-caja">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10 12 3l9 7"/><path d="M5 9v11h14V9"/></svg>
          <input id="regCodigoPostal" name="codigo_postal" type="number" placeholder="Ej: 1712" autocomplete="postal-code" required>
        </div>
      </div>
      <div class="auth-campo">
        <label for="regTelefono">Teléfono</label>
        <div class="auth-campo-caja">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.4 2.1L8.1 9.7a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.4c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.7 2Z"/></svg>
          <input id="regTelefono" name="telefono" type="number" placeholder="Ej: 1122334455" autocomplete="tel" required>
        </div>
      </div>
      <div class="auth-campo">
        <label for="regContrasena">Contraseña</label>
        <div class="auth-campo-caja">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/></svg>
          <input id="regContrasena" name="Contrasena" type="password" placeholder="Al menos 8 caracteres" autocomplete="new-password" required>
        </div>
      </div>
      <div class="auth-campo">
        <label for="regContrasena2">Repetir contraseña</label>
        <div class="auth-campo-caja">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/></svg>
          <input id="regContrasena2" name="Contrasena2" type="password" placeholder="Repetí la contraseña" autocomplete="new-password" required>
        </div>
      </div>

      <!-- El backend espera este campo por el chequeo isset($_POST["Enviar"]) que ya no usa
           Sing_Up_Code.php, pero se deja el name="Enviar" en el botón por si tu versión sí lo pide -->
      <button type="submit" class="btn-auth" name="Enviar" value="Enviar">Registrarme</button>
      <button type="button" class="enlace-cambio" id="irLoginMovil">¿Ya tenés cuenta? Iniciar sesión</button>
      <p id="errorRegister" class="msg-auth"></p>
    </form>

    <div class="auth-superposicion-env">
      <div class="auth-superposicion">
        <div class="auth-panel auth-panel-izq">
          <h3>¿Todavía no tenés cuenta?</h3>
          <p>Registrate gratis para empezar a usar la plataforma.</p>
          <button class="btn-auth-ghost" id="irRegister" type="button">Registrarme</button>
        </div>
        <div class="auth-panel auth-panel-der">
          <h3>¿Ya tenés cuenta?</h3>
          <p>Iniciá sesión con tus datos para seguir reportando en tu barrio.</p>
          <button class="btn-auth-ghost" id="irLogin" type="button">Iniciar sesión</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script >
  /* ---- Deslizador login / registro (igual que reporte_urbano.html) ---- */
  var authContenedor = document.getElementById("authContenedor");
  function mostrarLogin(){ authContenedor.classList.remove("derecha"); }
  function mostrarRegistro(){ authContenedor.classList.add("derecha"); }

  document.getElementById("irRegister").addEventListener("click", mostrarRegistro);
  document.getElementById("irRegisterMovil").addEventListener("click", mostrarRegistro);
  document.getElementById("irLogin").addEventListener("click", mostrarLogin);
  document.getElementById("irLoginMovil").addEventListener("click", mostrarLogin);
</script>

<script type="module" src="js/login.js"></script>
<script type="module" src="js/augh.js"></script>

</body>
</html>
