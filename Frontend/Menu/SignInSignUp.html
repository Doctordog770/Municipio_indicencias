<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión / Registrarse — Municipalidad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/SignInSignUp.css">
</head>
<body>

<!-- Este contenedor organiza las vistas de inicio de sesión y registro. -->
<div class="auth-envoltorio">
  <div class="auth-contenedor" id="authContenedor">

    <!-- Este formulario permite iniciar sesión con correo y contraseña. -->
    <form class="formulario-login auth-form" id="formLogin" novalidate>
      <h2>Iniciar sesión</h2>
      <span class="sub">Entrá con tu cuenta para reportar y ver incidencias.</span>

      <div class="auth-campo">
        <label for="loginGmail">Correo electrónico</label>
        <div class="auth-campo-caja">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18v12H3z"/><path d="m3 7 9 6 9-6"/></svg>
          <input id="loginGmail" name="gmail" type="email" placeholder="tu@correo.com" autocomplete="username" required>
        </div>
      </div>
      <div class="auth-campo">
        <label for="loginContrasena">Contraseña</label>
        <div class="auth-campo-caja">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/></svg>
          <input id="loginContrasena" name="contrasena" type="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
      </div>

      <button type="submit" class="btn-auth">Entrar</button>
      <button type="button" class="enlace-cambio" id="irRegisterMovil">¿No tenés cuenta? Registrate</button>
      <p id="errorLogin" class="msg-auth"></p>
    </form>

    <!-- Este formulario permite registrar los datos de una nueva cuenta. -->
    <form class="formulario-registro auth-form" id="formRegister" novalidate>
      <h2>Crear cuenta</h2>
      <span class="sub">Registrate para empezar a reportar en tu barrio.</span>

      <div class="auth-campo">
        <label for="regNombre">Nombre</label>
        <div class="auth-campo-caja">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          <input id="regNombre" name="Nombre" type="text" placeholder="Ej: Lucía" autocomplete="given-name" required>
        </div>
      </div>
      <div class="auth-campo">
        <label for="regApellido">Apellido</label>
        <div class="auth-campo-caja">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          <input id="regApellido" name="Apellido" type="text" placeholder="Ej: Medina" autocomplete="family-name" required>
        </div>
      </div>
      <div class="auth-campo">
        <label for="regDni">DNI</label>
        <div class="auth-campo-caja">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h6M7 13h10"/></svg>
          <input id="regDni" name="Dni" type="number" placeholder="Sin puntos, 7 u 8 dígitos" autocomplete="off" required>
        </div>
      </div>
      <div class="auth-campo">
        <label for="regGmail">Correo electrónico</label>
        <div class="auth-campo-caja">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18v12H3z"/><path d="m3 7 9 6 9-6"/></svg>
          <input id="regGmail" name="Gmail" type="email" placeholder="tu@correo.com" autocomplete="email" required>
        </div>
      </div>
      <div class="auth-campo">
        <label for="regLocalidad">Localidad</label>
        <div class="auth-campo-caja">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-7.5 7-12a7 7 0 1 0-14 0c0 4.5 7 12 7 12Z"/><circle cx="12" cy="9" r="2.5"/></svg>
          <input id="regLocalidad" name="localidad" type="text" placeholder="Ej: Castelar" autocomplete="address-level2" required>
        </div>
      </div>
      <div class="auth-campo">
        <label for="regDireccion">Dirección</label>
        <div class="auth-campo-caja">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10 12 3l9 7"/><path d="M5 9v11h14V9"/></svg>
          <input id="regDireccion" name="direccion" type="text" placeholder="Calle y altura" autocomplete="street-address" required>
        </div>
      </div>
      <div class="auth-campo">
        <label for="regCodigoPostal">Código postal</label>
        <div class="auth-campo-caja">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10 12 3l9 7"/><path d="M5 9v11h14V9"/></svg>
          <input id="regCodigoPostal" name="codigo_postal" type="number" placeholder="Ej: 1712" autocomplete="postal-code" required>
        </div>
      </div>
      <div class="auth-campo">
        <label for="regTelefono">Teléfono</label>
        <div class="auth-campo-caja">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.4 2.1L8.1 9.7a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.4c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.7 2Z"/></svg>
          <input id="regTelefono" name="telefono" type="number" placeholder="Ej: 1122334455" autocomplete="tel" required>
        </div>
      </div>
      <div class="auth-campo">
        <label for="regContrasena">Contraseña</label>
        <div class="auth-campo-caja">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/></svg>
          <input id="regContrasena" name="Contrasena" type="password" placeholder="Al menos 8 caracteres" autocomplete="new-password" required>
        </div>
      </div>
      <div class="auth-campo">
        <label for="regContrasena2">Repetir contraseña</label>
        <div class="auth-campo-caja">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/></svg>
          <input id="regContrasena2" name="Contrasena2" type="password" placeholder="Repetí la contraseña" autocomplete="new-password" required>
        </div>
      </div>

       <!-- Este botón conserva el nombre que puede esperar el servidor. -->
      <button type="submit" class="btn-auth" name="Enviar" value="Enviar">Registrarme</button>
      <button type="button" class="enlace-cambio" id="irLoginMovil">¿Ya tenés cuenta? Iniciar sesión</button>
      <p id="errorRegister" class="msg-auth"></p>
    </form>

    <!-- Este panel permite cambiar entre iniciar sesión y registrarse. -->
    <div class="auth-superposicion-env">
      <div class="auth-superposicion">
        <div class="auth-panel auth-panel-izq">
          <h3>¿Todavía no tenés cuenta?</h3>
          <p>Registrate gratis para empezar a usar la plataforma.</p>
          <button class="btn-auth-ghost" id="irRegister" type="button">Registrarme</button>
        </div>
        <div class="auth-panel auth-panel-der">
          <h3>¿Ya tenés cuenta?</h3>
          <p>Iniciá sesión con tus datos para seguir reportando en tu barrio.</p>
          <button class="btn-auth-ghost" id="irLogin" type="button">Iniciar sesión</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Estos scripts cambian de formulario y procesan la autenticación. -->
<script src="js/SignInSignUp.js"></script>

<script type="module" src="js/login.js"></script>
<script type="module" src="js/augh.js"></script>

</body>
</html>
