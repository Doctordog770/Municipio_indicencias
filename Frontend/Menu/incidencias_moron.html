    background-size: cover;
    background-position: center;
    filter: saturate(1.4) contrast(1.05);
    z-index: 0;
  }
  .fondo::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, rgba(226,35,26,0.88) 0%, rgba(163,22,15,0.85) 55%, rgba(90,10,8,0.9) 100%);
    mix-blend-mode: multiply;
  }
  .fondo::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(226,35,26,0.35);
    z-index: 1;
  }
  .contenido {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 480px;
    padding: 48px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 22px;
  }
  .icono {
    width: 130px;
    height: 130px;
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    border: 4px solid rgba(255,255,255,0.85);
    background: var(--rojo);
  }
  .icono img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  h1 {
    color: #ffffff;
    font-size: clamp(28px, 6vw, 42px);
    font-weight: 800;
    letter-spacing: 0.5px;
    text-shadow: 0 4px 14px rgba(0,0,0,0.45);
    margin: 0;
    line-height: 1.15;
  }
  h1 span {
    display: block;
    font-size: 0.5em;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0.9;
    margin-bottom: 6px;
  }
  .btn-empezar {
    margin-top: 12px;
    padding: 16px 54px;
    font-size: 18px;
    font-weight: 700;
    color: var(--rojo);
    background: #ffffff;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(0,0,0,0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    letter-spacing: 0.5px;
  }
  .btn-empezar:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 30px rgba(0,0,0,0.4);
  }
  .btn-empezar:active {
    transform: translateY(0px) scale(0.98);
  }
</style>
