<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear incidente — Municipalidad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/incidentes_crear.css">
</head>
<body>
<!-- La cabecera identifica al municipio y permite cerrar la sesión. -->

<header class="topbar">
  <div class="topbar-marca">
    <div class="topbar-logo">M</div>
    <div>
      <span>Municipalidad</span>
      <small>Gestión de incidencias</small>
    </div>
  </div>
  <button class="btn-salir" id="btnSalir">Cerrar sesión</button>
</header>

<main class="pagina-envoltorio">
  <!-- Este enlace permite volver al menú principal. -->
  <a class="enlace-volver" href="menu_opciones.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    Volver al menú
  </a>

  <div class="pagina-titulo">
    <h1>Crear incidente</h1>
  </div>

  <!-- Este formulario permite definir un nuevo tipo de incidente. -->
  <form id="form" class="form-tarjeta" novalidate>
    <div class="campo">
      <label for="tipo_incidente">Tipo de incidente</label>
      <select id="tipo_incidente" name="tipo_incidente" required>
        <option value="Bache / pavimento dañado">Bache / pavimento dañado</option>
        <option value="Luminaria / alumbrado público">Luminaria / alumbrado público</option>
        <option value="Basura / residuos">Basura / residuos</option>
        <option value="Semáforo">Semáforo</option>
        <option value="Árbol / poda">Árbol / poda</option>
        <option value="Agua / desagüe">Agua / desagüe</option>
        <option value="Espacio verde / plaza">Espacio verde / plaza</option>
        <option value="Otro">Otro</option>
      </select>
    </div>

    <div class="campo">
      <label for="detalles">Detalles</label>
      <textarea id="detalles" name="detalles" maxlength="1000" placeholder="Contanos qué pasó y dónde exactamente…" required></textarea>
      <span class="contador" id="contador">0/1000</span>
    </div>

    <div class="campo">
      <label for="ubicacion">Ubicación</label>
      <select id="ubicacion" name="ubicacion" required>
        <option value="Morón">Morón</option>
        <option value="Castelar">Castelar</option>
        <option value="Haedo">Haedo</option>
        <option value="El Palomar">El Palomar</option>
        <option value="Villa Sarmiento">Villa Sarmiento</option>
      </select>
    </div>

    <button type="submit" class="btn-primario" id="btnEnviar">Crear incidente</button>
    <p id="mensaje" class="msg-form"></p>
  </form>
</main>

<!-- Estos scripts controlan la sesión y el formulario. -->
<script src="js/menu.js"></script>
<script type="module" src="js/incidentes_crear.js"></script>
</body>
</html>
