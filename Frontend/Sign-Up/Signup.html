<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form id="form">
        <section class="titulo">
            <label for="">Registrarse</label>
        </section>
        <section>
            <label class="texto">Ingrese Nombre</label>
            <input class="input" type="text" name="Nombre" required>
        </section>
        <section>
            <label class="texto">Ingrese Apellido</label>
            <input class="input" type="text" name="Apellido" required>
        </section>
        <section>
            <label class="texto">Dni</label>
            <input class="input" type="number" name="Dni" required>
        </section>
        <section>
            <label class="texto">Ingrese Gmail</label>
            <input class="input" type="email" name="Gmail" required>
        </section>
        <section>
            <label class="texto">ingrese su localidad</label>
            <input type="text" name="localidad" class="input" required>
        </section>
        <section>
            <label class="texto">ingrese su telefono</label>
            <input type="number" class="input" name="telefono" required> 
        </section>
        <section>
            <label class="texto">Ingrese Contraseña</label>
            <input class="input" type="password" name="Contrasena" required>
        </section>
        <section>
            <label class="texto">Ingrese nuevamente la Contraseña</label>
            <input class="input" type="password" name="Contrasena2" required>
        </section>
        <section>
            <input class="enviar" type="submit" value="Enviar" name="Enviar">
        </section>
        <section>
            <p id="error" class="error2"></p>
        </section>
        <script src="../js/augh.js"></script>
    </form>
</body>
</html>
